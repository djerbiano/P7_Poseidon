<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8"/>
    <title>Access Denied</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <div class="row justify-content-center" style="margin-top: 100px;">
        <div class="col-auto text-center">
            <h1>403</h1>
            <h3>Access Denied</h3>
            <p class="error text-danger" th:text="${errorMsg}">Error</p>

            <div sec:authorize="isAuthenticated()" style="margin-bottom: 15px;">
                <p>Logged in user: <b th:inline="text" class="user"> [[${#authentication.name}]] </b></p>
                <form th:action="@{/logout}" method="POST">
                    <input type="submit" value="Logout" class="btn btn-primary btn-sm"/>
                </form>
            </div>

            <a href="/" class="btn btn-danger btn-sm">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
